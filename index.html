<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アクアリウム</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #04203a; }
  canvas { display: block; width: 100%; height: 100%; cursor: pointer; touch-action: none; }
  #hint {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
    color: #fff; font: 14px/1.4 sans-serif; background: rgba(0, 0, 0, .35);
    padding: 6px 14px; border-radius: 20px; pointer-events: none; user-select: none;
    white-space: nowrap; transition: opacity 1.5s;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">クリックでエサやり ／ F キーで全画面</div>
<script>
(() => {
  'use strict';

  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  // 背景（グラデーション＋砂利）は変化しないので別キャンバスに一度だけ描いて使い回す
  const bg = document.createElement('canvas');
  const bgx = bg.getContext('2d');

  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[(Math.random() * arr.length) | 0];
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const TAU = Math.PI * 2;

  let W = 0, H = 0, DPR = 1, S = 1, sandTop = 0;

  const fishes = [];
  const foods = [];
  const bubbles = [];
  const puffs = [];
  const plants = [];

  // 砂利の表面の高さ（少し波打たせる）
  const sandY = x => sandTop + Math.sin(x * 0.013) * 6 * S + Math.sin(x * 0.037 + 1) * 3 * S;
  const swimTop = () => 50 * S;
  const swimBottom = () => Math.max(swimTop() + 10, sandTop - 35 * S);

  // ---------------- 背景 ----------------
  function drawBackground() {
    const g = bgx;
    g.setTransform(DPR, 0, 0, DPR, 0, 0);

    const water = g.createLinearGradient(0, 0, 0, H);
    water.addColorStop(0, '#6fd0f0');
    water.addColorStop(0.3, '#2a8cc4');
    water.addColorStop(0.7, '#0d4a80');
    water.addColorStop(1, '#04203a');
    g.fillStyle = water;
    g.fillRect(0, 0, W, H);

    // 奥の水草（動かないシルエットで奥行きを出す）
    g.fillStyle = 'rgba(10, 60, 70, 0.35)';
    const farCount = Math.ceil(W / 60);
    for (let i = 0; i < farCount; i++) {
      const bx = rand(0, W), h = rand(0.15, 0.35) * H, w = rand(6, 14) * S, lean = rand(-30, 30) * S;
      const by = sandTop + 4 * S;
      g.beginPath();
      g.moveTo(bx - w / 2, by);
      g.quadraticCurveTo(bx + lean * 0.3 - w / 2, by - h * 0.6, bx + lean, by - h);
      g.quadraticCurveTo(bx + lean * 0.3 + w / 2, by - h * 0.6, bx + w / 2, by);
      g.fill();
    }

    // 砂地
    const sand = g.createLinearGradient(0, sandTop - 10 * S, 0, H);
    sand.addColorStop(0, '#9a8a68');
    sand.addColorStop(1, '#3a3124');
    g.fillStyle = sand;
    g.beginPath();
    g.moveTo(0, H);
    for (let x = 0; x <= W; x += 10) g.lineTo(x, sandY(x));
    g.lineTo(W, sandY(W));
    g.lineTo(W, H);
    g.closePath();
    g.fill();

    // 石
    for (let i = 0; i < 2; i++) {
      const rx = rand(0.15, 0.85) * W, rw = rand(40, 70) * S, rh = rand(22, 38) * S;
      const ry = sandY(rx) + rh * 0.35;
      const rg = g.createRadialGradient(rx - rw * 0.3, ry - rh * 0.5, 2, rx, ry, rw);
      rg.addColorStop(0, '#8c949a');
      rg.addColorStop(1, '#3b4247');
      g.fillStyle = rg;
      g.beginPath();
      g.ellipse(rx, ry, rw, rh, rand(-0.15, 0.15), 0, TAU);
      g.fill();
    }

    // 砂利の粒
    const colors = ['#b8a888', '#9c8b6e', '#d6c9a8', '#7d6e57', '#a39478', '#c2b59a', '#6b5e4b', '#8f8a80'];
    const depth = H - sandTop;
    const count = Math.min(2200, (W * depth) / 40);
    for (let i = 0; i < count; i++) {
      const x = rand(0, W);
      const top = sandY(x) + 1;
      const y = rand(top, H + 2);
      const r = rand(1.5, 4.5) * S;
      g.fillStyle = pick(colors);
      g.beginPath();
      g.ellipse(x, y, r, r * rand(0.6, 0.9), rand(0, Math.PI), 0, TAU);
      g.fill();
      g.fillStyle = 'rgba(255,255,255,0.18)';
      g.beginPath();
      g.arc(x - r * 0.3, y - r * 0.3, r * 0.35, 0, TAU);
      g.fill();
    }
    // 深いところほど暗く
    const shade = g.createLinearGradient(0, sandTop, 0, H);
    shade.addColorStop(0, 'rgba(0,20,40,0)');
    shade.addColorStop(1, 'rgba(0,20,40,0.55)');
    g.fillStyle = shade;
    g.fillRect(0, sandTop - 10 * S, W, H - sandTop + 10 * S);
  }

  // ---------------- 光の筋 ----------------
  const rays = Array.from({ length: 6 }, () => ({
    x: rand(-0.1, 1), w: rand(40, 110), sp: rand(0.15, 0.4), ph: rand(0, TAU), sk: rand(0.1, 0.3)
  }));

  function drawRays(t) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const len = sandTop;
    for (const r of rays) {
      const sway = Math.sin(t * r.sp + r.ph) * 40 * S;
      const a = 0.05 + 0.04 * Math.sin(t * r.sp * 2.3 + r.ph * 1.7);
      const x0 = r.x * W + sway, w = r.w * S, off = len * r.sk;
      const g = ctx.createLinearGradient(0, 0, 0, len);
      g.addColorStop(0, `rgba(255,255,225,${a.toFixed(3)})`);
      g.addColorStop(1, 'rgba(255,255,225,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(x0, 0);
      ctx.lineTo(x0 + w, 0);
      ctx.lineTo(x0 + w * 2.2 + off, len);
      ctx.lineTo(x0 - w * 0.6 + off, len);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  // ---------------- 水面 ----------------
  function surfacePath(t) {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    for (let x = 0; x <= W + 16; x += 16) {
      ctx.lineTo(x, 8 * S + Math.sin(x * 0.02 + t * 1.5) * 3 * S + Math.sin(x * 0.007 - t) * 4 * S);
    }
    ctx.lineTo(W + 16, 0);
    ctx.closePath();
  }

  function drawSurface(t) {
    surfacePath(t);
    ctx.fillStyle = 'rgba(255,255,255,0.13)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  // ---------------- 水草 ----------------
  const plantColors = ['#2e8b57', '#3fa34d', '#1f6e43', '#5cb85c', '#7cbf3a', '#2a7a5a'];

  function makePlants() {
    const n = clamp(Math.round(W / 150), 4, 10);
    for (let i = 0; i < n; i++) {
      const red = Math.random() < 0.15;
      plants.push({
        fx: (i + rand(0.15, 0.85)) / n,
        front: Math.random() < 0.25,
        blades: Array.from({ length: 3 + ((Math.random() * 3) | 0) }, () => ({
          h: rand(0.25, 0.55), w: rand(9, 15), lean: rand(-0.25, 0.25), dx: rand(-8, 8),
          ph: rand(0, TAU), sp: rand(0.6, 1.1),
          col: red ? pick(['#a8452f', '#c0583a', '#8e3a2a']) : pick(plantColors)
        }))
      });
    }
  }

  function drawBlade(bx, by, b, t) {
    const n = 10, h = b.h * sandTop * 0.9, w = b.w * S;
    const L = [], R = [];
    for (let i = 0; i <= n; i++) {
      const k = i / n;
      const sway = Math.sin(t * b.sp + b.ph - k * 1.8) * 18 * S * k * k + b.lean * h * k * k;
      const x = bx + sway, y = by - h * k;
      const ww = w * (1 - k * 0.85) * (0.8 + 0.2 * Math.sin(k * 9 + b.ph));
      L.push(x - ww / 2, y);
      R.push(x + ww / 2, y);
    }
    ctx.beginPath();
    ctx.moveTo(L[0], L[1]);
    for (let i = 2; i < L.length; i += 2) ctx.lineTo(L[i], L[i + 1]);
    for (let i = R.length - 2; i >= 0; i -= 2) ctx.lineTo(R[i], R[i + 1]);
    ctx.closePath();
    ctx.fillStyle = b.col;
    ctx.fill();
  }

  function drawPlants(t, front) {
    for (const p of plants) {
      if (p.front !== front) continue;
      const x = p.fx * W;
      for (const b of p.blades) drawBlade(x + b.dx * S, sandY(x) + 4 * S, b, t);
    }
  }

  // ---------------- 泡 ----------------
  const emitters = [rand(0.08, 0.3), rand(0.65, 0.92)];

  function resetBubble(b, anywhere) {
    b.x = Math.random() < 0.7 ? pick(emitters) * W + rand(-5, 5) * S : rand(0, W);
    b.y = anywhere ? rand(swimTop(), sandTop) : sandY(b.x);
    b.r = rand(1.5, 4) * S;
    b.vy = rand(35, 70) * S;
    b.ph = rand(0, TAU);
  }

  function updateBubbles(dt) {
    for (const b of bubbles) {
      b.y -= b.vy * dt;
      if (b.y < 10 * S) resetBubble(b, false);
    }
  }

  function drawBubbles(t) {
    ctx.beginPath();
    for (const b of bubbles) {
      const x = b.x + Math.sin(t * 3 + b.ph) * 3 * S;
      ctx.moveTo(x + b.r, b.y);
      ctx.arc(x, b.y, b.r, 0, TAU);
    }
    ctx.strokeStyle = 'rgba(220,245,255,0.6)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.fill();
    ctx.beginPath();
    for (const b of bubbles) {
      const x = b.x + Math.sin(t * 3 + b.ph) * 3 * S;
      ctx.moveTo(x - b.r * 0.35, b.y - b.r * 0.35);
      ctx.arc(x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.3, 0, TAU);
    }
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.fill();
  }

  // ---------------- エサ ----------------
  function dropFood(cx, cy) {
    const n = 4 + ((Math.random() * 3) | 0);
    for (let i = 0; i < n; i++) {
      if (foods.length >= 40) foods.shift();
      foods.push({
        x: cx + rand(-18, 18) * S, y: cy + rand(-8, 8) * S, vy: rand(22, 40) * S,
        ph: rand(0, TAU), r: rand(2.5, 3.6) * S, life: 14, landed: false, eaten: false,
        col: pick(['#c8783a', '#b8602e', '#d89a50'])
      });
    }
  }

  function updateFoods(dt, t) {
    for (const f of foods) {
      if (!f.landed) {
        f.y += f.vy * dt;
        f.x += Math.sin(t * 2 + f.ph) * 10 * S * dt;
        const floor = sandY(f.x) - f.r;
        if (f.y >= floor) { f.y = floor; f.landed = true; }
      }
      f.life -= dt;
      if (f.life <= 0) f.eaten = true;
    }
    for (let i = foods.length - 1; i >= 0; i--) if (foods[i].eaten) foods.splice(i, 1);
  }

  function drawFoods() {
    for (const f of foods) {
      ctx.globalAlpha = Math.min(1, f.life / 2);
      ctx.fillStyle = f.col;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, TAU);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,230,190,0.6)';
      ctx.beginPath();
      ctx.arc(f.x - f.r * 0.3, f.y - f.r * 0.3, f.r * 0.35, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // 食べたときの小さな波紋
  function drawPuffs(dt) {
    for (let i = puffs.length - 1; i >= 0; i--) {
      const p = puffs[i];
      p.t += dt;
      if (p.t > 0.4) { puffs.splice(i, 1); continue; }
      ctx.strokeStyle = `rgba(255,255,255,${(1 - p.t / 0.4) * 0.7})`;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(p.x, p.y, (3 + p.t * 25) * S, 0, TAU);
      ctx.stroke();
    }
  }

  // ---------------- 魚 ----------------
  // ひれの形: [付け根前x,y, 制御点x,y, 先端x,y, 制御点x,y, 付け根後x,y]（体長L・体高Hに対する比率）
  const SPECIES = {
    clown: {
      len: 46, h: 24, speed: 55, body: '#ff7a1a', fin: '#ff8a2a', edge: '#1a1a1a', tail: 'fan', pattern: 'clown',
      fins: [[0.22, -0.38, 0.1, -0.85, -0.12, -0.75, -0.25, -0.6, -0.32, -0.25],
             [0.0, 0.38, -0.08, 0.72, -0.2, 0.68, -0.3, 0.5, -0.34, 0.22]]
    },
    neon: {
      len: 32, h: 11, speed: 95, body: '#c9d6dc', fin: 'rgba(220,235,240,0.6)', tail: 'fork', pattern: 'neon',
      fins: [[0.05, -0.4, 0.0, -0.9, -0.1, -0.95, -0.15, -0.6, -0.2, -0.38],
             [0.05, 0.4, -0.05, 0.8, -0.25, 0.75, -0.3, 0.5, -0.3, 0.3]]
    },
    angel: {
      len: 44, h: 46, speed: 32, body: '#ece8dc', fin: 'rgba(235,230,215,0.85)', tail: 'angel', pattern: 'angel',
      fins: [[0.15, -0.42, 0.0, -0.9, -0.55, -1.25, -0.35, -0.7, -0.3, -0.3],
             [0.12, 0.42, 0.0, 0.9, -0.55, 1.25, -0.35, 0.7, -0.3, 0.3]]
    },
    yellow: {
      len: 52, h: 36, speed: 50, body: '#ffd51a', fin: '#ffcc00', tail: 'fan', pattern: 'yellow',
      fins: [[0.3, -0.4, 0.0, -0.75, -0.35, -0.48, -0.4, -0.35, -0.4, -0.15],
             [0.15, 0.42, -0.05, 0.72, -0.35, 0.48, -0.4, 0.35, -0.4, 0.15]]
    },
    betta: {
      len: 42, h: 18, speed: 28, body: '#4b2fbf', fin: 'rgba(200,40,110,0.85)', tailCol: 'rgba(215,50,120,0.85)',
      tail: 'flow', pattern: 'betta',
      fins: [[0.0, -0.42, -0.1, -1.3, -0.55, -1.1, -0.5, -0.6, -0.4, -0.15],
             [0.25, 0.4, 0.0, 1.5, -0.6, 1.3, -0.5, 0.6, -0.4, 0.15]]
    },
    tang: {
      len: 56, h: 30, speed: 45, body: '#1d58d8', fin: '#0e2a6e', tailCol: '#ffd21a', tail: 'fan', pattern: 'tang',
      fins: [[0.3, -0.4, 0.0, -0.72, -0.38, -0.42, -0.42, -0.3, -0.42, -0.12],
             [0.1, 0.42, -0.1, 0.72, -0.38, 0.42, -0.42, 0.3, -0.42, 0.12]]
    }
  };

  function makeFish(sp) {
    const dir = Math.random() < 0.5 ? -1 : 1;
    const speed = sp.speed * rand(0.85, 1.15);
    const y = rand(swimTop(), swimBottom());
    return {
      sp, size: rand(0.9, 1.1), speed, dir, face: dir, cruise: 1,
      x: rand(0.1, 0.9) * W, y, ty: y, vx: dir * speed * S, vy: 0,
      timer: rand(2, 6), ph: rand(0, TAU), wag: rand(0, TAU),
      bobF: rand(0.8, 1.6), bobA: rand(2, 5)
    };
  }

  function updateFish(f, dt) {
    const L = f.sp.len * S * f.size, Hh = f.sp.h * S * f.size;
    const spd = f.speed * S;
    const faceSign = f.face < 0 ? -1 : 1;
    const mouthX = f.x + faceSign * L * 0.5;
    let dvx, dvy, k = 1.5;

    // 一番近いエサを探す
    let best = null, bd = Infinity;
    for (const fd of foods) {
      if (fd.eaten) continue;
      const dx = fd.x - mouthX, dy = fd.y - f.y, d = dx * dx + dy * dy;
      if (d < bd) { bd = d; best = fd; }
    }

    if (best) {
      const dx = best.x - mouthX, dy = best.y - f.y;
      const d = Math.hypot(dx, dy) || 1;
      const s = spd * 1.8 * Math.min(1, d / (30 * S) + 0.25);
      dvx = (dx / d) * s;
      dvy = (dy / d) * s;
      k = 2.5;
      if (d < Math.max(8 * S, Hh * 0.45)) {
        best.eaten = true;
        puffs.push({ x: best.x, y: best.y, t: 0 });
      }
      f.dir = dx >= 0 ? 1 : -1;
      f.ty = clamp(f.y, swimTop(), swimBottom());
    } else {
      f.timer -= dt;
      if (f.timer <= 0) {
        f.timer = rand(3, 8);
        f.ty = rand(swimTop(), swimBottom());
        f.cruise = rand(0.6, 1.2);
        if (Math.random() < 0.25) f.dir *= -1;
      }
      // 端に来たらUターン
      const m = L * 0.6 + 10 * S;
      if (f.x > W - m && f.dir > 0) f.dir = -1;
      else if (f.x < m && f.dir < 0) f.dir = 1;
      dvx = f.dir * spd * f.cruise;
      dvy = clamp((f.ty - f.y) * 0.6, -spd * 0.5, spd * 0.5);
    }

    const a = Math.min(1, dt * k);
    f.vx += (dvx - f.vx) * a;
    f.vy += (dvy - f.vy) * a;
    f.x += f.vx * dt;
    f.y += f.vy * dt;
    f.x = clamp(f.x, L * 0.3, W - L * 0.3);
    f.y = clamp(f.y, swimTop(), best ? sandY(f.x) - Hh * 0.4 : swimBottom());

    // 向き：進行方向へなめらかに反転（途中で細く見えて、くるっと回る感じになる）
    if (f.vx > 4 * S) f.want = 1;
    else if (f.vx < -4 * S) f.want = -1;
    if (f.want) f.face += (f.want - f.face) * Math.min(1, dt * 6);

    f.wag += dt * (4 + (Math.abs(f.vx) / spd) * 6);
  }

  function bodyPath(L, H) {
    ctx.beginPath();
    ctx.moveTo(L * 0.5, 0);
    ctx.bezierCurveTo(L * 0.42, -H * 0.62, -L * 0.2, -H * 0.62, -L * 0.45, -H * 0.08);
    ctx.lineTo(-L * 0.45, H * 0.08);
    ctx.bezierCurveTo(-L * 0.2, H * 0.62, L * 0.42, H * 0.62, L * 0.5, 0);
    ctx.closePath();
  }

  function drawTail(sp, L, H, f) {
    ctx.fillStyle = sp.tailCol || sp.fin;
    ctx.beginPath();
    if (sp.tail === 'fork') {
      const tl = L * 0.3, th = H * 0.55;
      ctx.moveTo(L * 0.04, 0);
      ctx.quadraticCurveTo(-tl * 0.4, -th * 0.3, -tl, -th);
      ctx.quadraticCurveTo(-tl * 0.55, 0, -tl, th);
      ctx.quadraticCurveTo(-tl * 0.4, th * 0.3, L * 0.04, 0);
    } else if (sp.tail === 'fan') {
      const tl = L * 0.28, th = H * 0.45;
      ctx.moveTo(L * 0.04, -H * 0.08);
      ctx.lineTo(-tl, -th);
      ctx.quadraticCurveTo(-tl * 1.25, 0, -tl, th);
      ctx.lineTo(L * 0.04, H * 0.08);
    } else if (sp.tail === 'flow') {
      const tl = L * 0.75, th = H * 1.3, w2 = Math.sin(f.wag * 0.7) * H * 0.25;
      ctx.moveTo(L * 0.05, -H * 0.12);
      ctx.bezierCurveTo(-tl * 0.3, -th * 0.9, -tl * 0.8, -th + w2, -tl, -th * 0.5 + w2);
      ctx.quadraticCurveTo(-tl * 1.15, w2, -tl, th * 0.5 + w2);
      ctx.bezierCurveTo(-tl * 0.8, th + w2, -tl * 0.3, th * 0.9, L * 0.05, H * 0.12);
    } else if (sp.tail === 'angel') {
      const tl = L * 0.3, th = H * 0.3;
      ctx.moveTo(L * 0.04, -H * 0.06);
      ctx.lineTo(-tl, -th);
      ctx.quadraticCurveTo(-tl * 1.2, 0, -tl, th);
      ctx.lineTo(L * 0.04, H * 0.06);
    }
    ctx.closePath();
    ctx.fill();
    if (sp.tail === 'angel') {
      // 尾の長い糸
      ctx.strokeStyle = sp.fin;
      ctx.lineWidth = Math.max(1, L * 0.03);
      ctx.beginPath();
      ctx.moveTo(-L * 0.3, -H * 0.3);
      ctx.lineTo(-L * 0.6, -H * 0.45);
      ctx.moveTo(-L * 0.3, H * 0.3);
      ctx.lineTo(-L * 0.6, H * 0.45);
      ctx.stroke();
    }
    if (sp.edge) {
      ctx.strokeStyle = sp.edge;
      ctx.lineWidth = 1.2 * S;
      ctx.stroke();
    }
  }

  function drawFins(sp, L, H, f) {
    ctx.fillStyle = sp.fin;
    sp.fins.forEach((p, i) => {
      const wave = Math.sin(f.wag * 0.5 + i * 1.3) * 0.06 * (p[5] < 0 ? -1 : 1);
      ctx.beginPath();
      ctx.moveTo(p[0] * L, p[1] * H);
      ctx.quadraticCurveTo(p[2] * L, p[3] * H, p[4] * L, (p[5] + wave) * H);
      ctx.quadraticCurveTo(p[6] * L, p[7] * H, p[8] * L, p[9] * H);
      ctx.closePath();
      ctx.fill();
      if (sp.edge) {
        ctx.strokeStyle = sp.edge;
        ctx.lineWidth = 1.2 * S;
        ctx.stroke();
      }
    });
  }

  function band(x, w, L, H, col) {
    ctx.fillStyle = col;
    ctx.fillRect((x - w / 2) * L, -H, w * L, H * 2);
  }

  function drawPattern(sp, L, H) {
    switch (sp.pattern) {
      case 'clown':
        [[0.3, 0.09], [0.02, 0.11], [-0.32, 0.08]].forEach(([x, w]) => {
          band(x, w + 0.04, L, H, '#1a1a1a');
          band(x, w, L, H, '#ffffff');
        });
        break;
      case 'neon':
        ctx.fillStyle = '#5f7f8e';
        ctx.fillRect(-L, -H, L * 2, H * 0.8);
        ctx.fillStyle = '#28e8ff';
        ctx.fillRect(-L * 0.42, -H * 0.22, L * 0.78, H * 0.2);
        ctx.fillStyle = '#ff2d3d';
        ctx.fillRect(-L * 0.5, 0, L * 0.52, H);
        break;
      case 'angel':
        band(0.27, 0.06, L, H, 'rgba(40,40,40,0.85)');
        band(0.0, 0.09, L, H, 'rgba(40,40,40,0.85)');
        band(-0.27, 0.07, L, H, 'rgba(40,40,40,0.85)');
        break;
      case 'yellow':
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.ellipse(-L * 0.36, 0, L * 0.04, H * 0.04, 0, 0, TAU);
        ctx.fill();
        break;
      case 'betta':
        ctx.fillStyle = 'rgba(200,30,100,0.55)';
        ctx.fillRect(-L, -H, L * 0.85, H * 2);
        ctx.fillStyle = 'rgba(120,180,255,0.35)';
        ctx.fillRect(-L * 0.1, -H, L * 0.4, H * 2);
        break;
      case 'tang':
        ctx.fillStyle = '#0a1230';
        ctx.beginPath();
        ctx.moveTo(L * 0.33, -H * 0.18);
        ctx.quadraticCurveTo(L * 0.05, -H * 0.62, -L * 0.42, -H * 0.1);
        ctx.quadraticCurveTo(-L * 0.12, -H * 0.22, -L * 0.05, H * 0.1);
        ctx.quadraticCurveTo(L * 0.1, -H * 0.25, L * 0.33, -H * 0.18);
        ctx.fill();
        break;
    }
  }

  function drawFish(f, t) {
    const sp = f.sp, L = sp.len * S * f.size, H = sp.h * S * f.size;
    const bob = Math.sin(t * f.bobF + f.ph) * f.bobA * S;
    let sx = f.face;
    if (Math.abs(sx) < 0.12) sx = sx < 0 ? -0.12 : 0.12;
    const tilt = clamp(Math.atan2(f.vy, Math.abs(f.vx) + 20 * S), -0.45, 0.45);

    ctx.save();
    ctx.translate(f.x, f.y + bob);
    ctx.scale(sx, 1);
    ctx.rotate(tilt);

    // 尾びれ（左右にふる）
    ctx.save();
    ctx.translate(-L * 0.44, 0);
    ctx.rotate(Math.sin(f.wag) * 0.35);
    drawTail(sp, L, H, f);
    ctx.restore();

    drawFins(sp, L, H, f);

    // 胴体＋模様
    bodyPath(L, H);
    ctx.fillStyle = sp.body;
    ctx.fill();
    ctx.save();
    ctx.clip();
    drawPattern(sp, L, H);
    ctx.fillStyle = 'rgba(0,20,50,0.18)';
    ctx.fillRect(-L, -H, L * 2, H * 0.75);
    ctx.fillStyle = 'rgba(255,255,255,0.16)';
    ctx.fillRect(-L, H * 0.15, L * 2, H);
    ctx.restore();
    if (sp.edge) {
      ctx.strokeStyle = 'rgba(0,0,0,0.35)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    // 胸びれ（パタパタ）
    ctx.fillStyle = sp.fin;
    ctx.globalAlpha = 0.75;
    ctx.beginPath();
    ctx.ellipse(L * 0.12, H * 0.14, L * 0.1, Math.max(1, H * 0.1), 0.6 + Math.sin(f.wag * 1.6) * 0.35, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 1;

    // 目
    const er = Math.max(1.3 * S, Math.min(L * 0.08, H * 0.14));
    const ex = L * 0.3, ey = -H * 0.08;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(ex, ey, er, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(ex + er * 0.15, ey, er * 0.62, 0, TAU);
    ctx.fill();

    ctx.restore();
  }

  // ---------------- 画面サイズ ----------------
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 1.5); // 高解像度すぎると重いので上限をつける
    W = window.innerWidth;
    H = window.innerHeight;
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    bg.width = cv.width;
    bg.height = cv.height;
    S = clamp(Math.min(W, H) / 800, 0.55, 1.4);
    sandTop = H - Math.max(40, H * 0.12);
    drawBackground();
    for (const f of fishes) {
      f.x = clamp(f.x, 0, W);
      f.y = clamp(f.y, swimTop(), swimBottom());
      f.ty = clamp(f.ty, swimTop(), swimBottom());
    }
    for (const fd of foods) {
      fd.x = clamp(fd.x, 0, W);
      if (fd.landed || fd.y > sandY(fd.x)) { fd.y = sandY(fd.x) - fd.r; fd.landed = true; }
    }
  }

  let resizeTimer = 0;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 100);
  });

  // ---------------- 操作 ----------------
  cv.addEventListener('pointerdown', e => dropFood(e.clientX, e.clientY));

  function toggleFullscreen() {
    const d = document, el = d.documentElement;
    if (!(d.fullscreenElement || d.webkitFullscreenElement)) {
      const req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (req) Promise.resolve(req.call(el)).catch(() => {});
    } else {
      const exit = d.exitFullscreen || d.webkitExitFullscreen;
      if (exit) Promise.resolve(exit.call(d)).catch(() => {});
    }
  }
  window.addEventListener('keydown', e => {
    if (e.code === 'KeyF' || e.key === 'f' || e.key === 'F') toggleFullscreen();
  });

  const hint = document.getElementById('hint');
  setTimeout(() => { hint.style.opacity = '0'; }, 6000);

  // ---------------- 初期化とループ ----------------
  resize();
  ['clown', 'neon', 'neon', 'angel', 'yellow', 'betta', 'tang'].forEach(k => fishes.push(makeFish(SPECIES[k])));
  makePlants();
  for (let i = 0; i < 35; i++) {
    const b = {};
    resetBubble(b, true);
    bubbles.push(b);
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); // タブ復帰時などの大きな飛びを防ぐ
    last = now;
    const t = now / 1000;

    updateFoods(dt, t);
    for (const f of fishes) updateFish(f, dt);
    updateBubbles(dt);

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.drawImage(bg, 0, 0, W, H);
    drawRays(t);
    drawPlants(t, false);
    drawFoods();
    for (const f of fishes) drawFish(f, t);
    drawPuffs(dt);
    drawBubbles(t);
    drawPlants(t, true);
    drawSurface(t);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
